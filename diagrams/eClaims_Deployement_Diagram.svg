<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1500" viewBox="0 0 1100 1500">
  <defs>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#A8201A"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#9673A6"/></marker>
    <style>
      text { font-family: Verdana, sans-serif; fill: #143642; }
      .box { stroke: #0F8B8D; stroke-width: 2; fill: #FAE5C7; }
      .runtime { stroke: #666; stroke-width: 1.5; fill: #f5f5f5; }
      .network { stroke: #6c8ebf; stroke-width: 2; fill: #dae8fc; }
      .delivery { stroke: #9673a6; stroke-width: 2; fill: #e1d5e7; }
      .external { stroke: #82b366; stroke-width: 2; fill: #d5e8d4; }
      .title { font-size: 18px; font-weight: bold; }
      .label { font-size: 15px; text-anchor: middle; }
      .small { font-size: 13px; text-anchor: middle; }
      .edgeRuntime { stroke: #A8201A; stroke-width: 2; fill: none; marker-end: url(#redArrow); }
      .edgeDelivery { stroke: #9673A6; stroke-width: 2; fill: none; marker-end: url(#purpleArrow); }
    </style>
  </defs>
  <rect width="1100" height="1500" fill="#ffffff"/>
  <text x="550" y="30" class="title" text-anchor="middle">eClaims Deployment Architecture</text>

  <rect x="30" y="55" width="1040" height="140" rx="4" class="delivery"/>
  <text x="550" y="80" class="title" text-anchor="middle">Software Delivery Flow</text>
  <rect x="60" y="105" width="230" height="60" rx="4" class="runtime"/>
  <text x="175" y="130" class="label">Git repository</text><text x="175" y="150" class="small">GitHub / GitLab</text>
  <rect x="435" y="105" width="230" height="60" rx="4" class="runtime"/>
  <text x="550" y="130" class="label">CI/CD pipeline</text><text x="550" y="150" class="small">Build, test, scan</text>
  <rect x="810" y="105" width="230" height="60" rx="4" class="runtime"/>
  <text x="925" y="130" class="label">Artifact registry</text><text x="925" y="150" class="small">Angular + Spring Boot</text>
  <path d="M290 135 H435" class="edgeDelivery"/><text x="362" y="125" class="small">Commit / merge</text>
  <path d="M665 135 H810" class="edgeDelivery"/><text x="737" y="125" class="small">Publish</text>

  <rect x="330" y="230" width="440" height="65" rx="4" class="box"/>
  <text x="550" y="258" class="label">Clients</text><text x="550" y="278" class="small">Customers / Partners / Operations</text>
  <path d="M550 295 V345" class="edgeRuntime"/><text x="585" y="325" class="small">HTTPS</text>
  <rect x="275" y="345" width="550" height="65" rx="4" class="box"/>
  <text x="550" y="373" class="label">Public edge / Internet</text><text x="550" y="393" class="small">WAF, TLS termination, routing</text>
  <path d="M550 410 V460" class="edgeRuntime"/>
  <rect x="235" y="460" width="630" height="65" rx="4" class="box"/>
  <text x="550" y="488" class="label">Load balancer / API Gateway</text><text x="550" y="508" class="small">Routes requests to the selected runtime</text>

  <path d="M925 165 V205 H175 V565" class="edgeDelivery"/>
  <path d="M925 165 V205 H925 V565" class="edgeDelivery"/>
  <text x="185" y="225" class="small">Deploy approved release</text><text x="935" y="225" class="small">Deploy approved release</text>
  <path d="M400 525 V565" class="edgeRuntime"/><path d="M700 525 V565" class="edgeRuntime"/>

  <rect x="45" y="565" width="470" height="650" rx="4" class="box"/>
  <text x="280" y="595" class="title" text-anchor="middle">Cloud Deployment (AWS)</text>
  <rect x="70" y="620" width="420" height="570" class="network"/>
  <text x="280" y="648" class="label">VPC / Private Subnets</text>
  <rect x="105" y="670" width="350" height="70" class="runtime"/><text x="280" y="698" class="label">EKS / Kubernetes</text><text x="280" y="718" class="small">Angular + Spring Boot pods, autoscaling</text>
  <rect x="105" y="760" width="350" height="60" class="runtime"/><text x="280" y="795" class="label">MSK (Kafka) event streaming</text>
  <rect x="105" y="840" width="350" height="60" class="runtime"/><text x="280" y="875" class="label">RDS PostgreSQL, Multi-AZ</text>
  <rect x="105" y="920" width="350" height="60" class="runtime"/><text x="280" y="955" class="label">S3 object storage / DMS</text>
  <rect x="105" y="1000" width="350" height="60" class="runtime"/><text x="280" y="1035" class="label">ElastiCache Redis</text>
  <rect x="105" y="1080" width="350" height="60" class="runtime"/><text x="280" y="1115" class="label">IAM / KMS / Monitoring</text>

  <rect x="585" y="565" width="470" height="650" rx="4" class="box"/>
  <text x="820" y="595" class="title" text-anchor="middle">On-Prem Deployment</text>
  <rect x="610" y="620" width="420" height="570" class="network"/>
  <text x="820" y="648" class="label">Private network / VLANs</text>
  <rect x="645" y="670" width="350" height="70" class="runtime"/><text x="820" y="698" class="label">OpenShift / Kubernetes</text><text x="820" y="718" class="small">Angular + Spring Boot pods, autoscaling</text>
  <rect x="645" y="760" width="350" height="60" class="runtime"/><text x="820" y="795" class="label">Kafka cluster event streaming</text>
  <rect x="645" y="840" width="350" height="60" class="runtime"/><text x="820" y="875" class="label">PostgreSQL HA</text>
  <rect x="645" y="920" width="350" height="60" class="runtime"/><text x="820" y="955" class="label">MinIO object storage</text>
  <rect x="645" y="1000" width="350" height="60" class="runtime"/><text x="820" y="1035" class="label">Redis cluster</text>
  <rect x="645" y="1080" width="350" height="60" class="runtime"/><text x="820" y="1115" class="label">Vault / LDAP / Monitoring</text>

  <rect x="275" y="1280" width="550" height="120" rx="4" class="external"/>
  <text x="550" y="1310" class="title" text-anchor="middle">External Systems</text>
  <text x="550" y="1340" class="small">Policy API  |  Payment gateway  |  ERP / Finance  |  SMS / Email</text>
  <path d="M280 1215 V1250 H430 V1280" class="edgeRuntime"/><path d="M820 1215 V1250 H670 V1280" class="edgeRuntime"/>
  <text x="550" y="1460" class="small"><tspan fill="#A8201A">Red: runtime traffic</tspan><tspan dx="30" fill="#9673A6">Purple: delivery flow</tspan></text>
</svg>