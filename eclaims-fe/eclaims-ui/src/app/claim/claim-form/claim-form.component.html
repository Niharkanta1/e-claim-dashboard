<div class="container" style="max-width: 60%; margin: 0 auto;">
    <h2 class="text-primary text-center mb-4">{{ 'claim.submitTitle' | translate }}</h2>
    <form (ngSubmit)="submitClaim()" class="p-4" [formGroup]="claimForm">
        <div class="mb-3">
            <label for="firstName" class="form-label">{{ 'claim.firstName' | translate }}<span class="text-danger">*</span></label>
            <input id="firstName" formControlName="firstName" class="form-control" />
        </div>
        <div class="mb-3">
            <label for="lastName" class="form-label">{{ 'claim.lastName' | translate }}<span class="text-danger">*</span></label>
            <input id="lastName" formControlName="lastName" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="policyNumber" class="form-label">{{ 'claim.policyNumber' | translate }}<span class="text-danger">*</span></label>
            <input id="policyNumber" formControlName="policyNumber" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="policyType" class="form-label">{{ 'claim.policyType' | translate }}<span class="text-danger">*</span></label>
            <select id="policyType" formControlName="policyType" class="form-control">
                <option value="" disabled selected>{{ 'claim.selectPolicyType' | translate }}</option>
                <option value="Personal Vehicle">{{ 'claim.personalVehicle' | translate }}</option><option value="Commercial">{{ 'claim.commercial' | translate }}</option><option value="Rental">{{ 'claim.rental' | translate }}</option><option value="Other">{{ 'claim.other' | translate }}</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="dateOfIncident" class="form-label">{{ 'claim.incidentDate' | translate }}<span class="text-danger">*</span></label>
            <input type="date" id="dateOfIncident" formControlName="dateOfIncident" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="claimType" class="form-label">{{ 'claim.type' | translate }}<span class="text-danger">*</span></label>
            <select id="claimType" formControlName="claimType" class="form-control">
                <option value="" disabled selected>{{ 'claim.selectType' | translate }}</option>
                <option value="Medical">{{ 'claim.medical' | translate }}</option><option value="Accident">{{ 'claim.accident' | translate }}</option><option value="Theft">{{ 'claim.theft' | translate }}</option><option value="Damage">{{ 'claim.damage' | translate }}</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">{{ 'claim.description' | translate }}</label>
            <textarea id="description" formControlName="description" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label for="contactNumber" class="form-label">{{ 'claim.contactNumber' | translate }}<span class="text-danger">*</span></label>
            <input id="contactNumber" formControlName="contactNumber" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="fileUpload" class="form-label">{{ 'claim.uploadFiles' | translate }}</label>
            <input type="file" id="fileUpload" multiple (change)="onFilesChange($event)" class="form-control" />
        </div>

        <button [disabled]="submitting" type="submit" class="btn btn-primary">
            {{ (submitting ? 'claim.submitting' : 'claim.submit') | translate }}
        </button>
    </form>

</div>
