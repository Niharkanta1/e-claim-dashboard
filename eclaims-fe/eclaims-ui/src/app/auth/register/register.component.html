<div class="container mt-5 col-md-6 col-lg-5">
  <h3 class="text-center text-primary mb-3">{{ 'register.title' | translate }}</h3>
  <div class="card p-4 shadow-sm">
    <div *ngIf="submitted" class="alert alert-success">{{ 'register.success' | translate }}</div>
    <form *ngIf="!submitted" (ngSubmit)="onRegister()" #registrationForm="ngForm">
      <div class="form-row">
        <div class="form-group col-md-6"><label>{{ 'register.firstName' | translate }}</label><input name="firstName" [(ngModel)]="user.firstName" class="form-control" required /></div>
        <div class="form-group col-md-6"><label>{{ 'register.lastName' | translate }}</label><input name="lastName" [(ngModel)]="user.lastName" class="form-control" required /></div>
      </div>
      <div class="form-group mt-3"><label>{{ 'register.email' | translate }}</label><input name="email" [(ngModel)]="user.email" type="email" class="form-control" required /></div>
      <div class="form-group mt-3"><label>{{ 'register.phone' | translate }}</label><input name="phoneNumber" [(ngModel)]="user.phoneNumber" class="form-control" /></div>
      <div class="form-group mt-3"><label>{{ 'register.address' | translate }}</label><input name="address" [(ngModel)]="user.address" class="form-control" /></div>
      <div class="form-group mt-3"><label>{{ 'register.username' | translate }}</label><input name="username" [(ngModel)]="user.username" class="form-control" required /></div>
      <div class="form-group mt-3"><label>{{ 'register.password' | translate }}</label><input name="password" [(ngModel)]="user.password" type="password" class="form-control" minlength="8" required /></div>
      <div class="form-group mt-3"><label>{{ 'register.confirmPassword' | translate }}</label><input name="confirmPassword" [(ngModel)]="confirmPassword" type="password" class="form-control" required /></div>
      <div class="text-danger mt-2">{{ error }}</div>
      <button type="submit" [disabled]="registrationForm.invalid" class="btn btn-primary w-100 mt-3">{{ 'register.submit' | translate }}</button>
    </form>
    <div class="text-center mt-3"><a routerLink="/login">{{ 'register.backToLogin' | translate }}</a></div>
  </div>
</div>
