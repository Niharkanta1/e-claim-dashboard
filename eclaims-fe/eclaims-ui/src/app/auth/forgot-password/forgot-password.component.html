<div class="container mt-5 col-md-5 col-lg-4">
  <h3 class="text-center text-primary mb-3">{{ 'forgotPassword.title' | translate }}</h3>
  <div class="card p-4 shadow-sm">
    <p class="text-muted">{{ 'forgotPassword.instructions' | translate }}</p>
    <div *ngIf="submitted" class="alert alert-success">{{ 'forgotPassword.success' | translate }}</div>
    <form *ngIf="!submitted" (ngSubmit)="onResetPassword()" #resetForm="ngForm">
      <div class="form-group"><label>{{ 'forgotPassword.username' | translate }}</label><input name="username" [(ngModel)]="username" class="form-control" required /></div>
      <div class="form-group mt-3"><label>{{ 'forgotPassword.email' | translate }}</label><input name="email" [(ngModel)]="email" type="email" class="form-control" required /></div>
      <div class="form-group mt-3"><label>{{ 'forgotPassword.newPassword' | translate }}</label><input name="newPassword" [(ngModel)]="newPassword" type="password" class="form-control" minlength="8" required /></div>
      <div class="form-group mt-3"><label>{{ 'forgotPassword.confirmPassword' | translate }}</label><input name="confirmPassword" [(ngModel)]="confirmPassword" type="password" class="form-control" required /></div>
      <div class="text-danger mt-2">{{ error }}</div>
      <button type="submit" [disabled]="resetForm.invalid" class="btn btn-primary w-100 mt-3">{{ 'forgotPassword.submit' | translate }}</button>
    </form>
    <div class="text-center mt-3"><a routerLink="/login">{{ 'forgotPassword.backToLogin' | translate }}</a></div>
  </div>
</div>
