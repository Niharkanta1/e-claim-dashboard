<div class="container mt-5 col-md-5 col-lg-4">
  <h3 class="text-center text-primary mb-3">{{ 'changePassword.title' | translate }}</h3>
  <div class="card p-4 shadow-sm">
    <div *ngIf="submitted" class="alert alert-success">{{ 'changePassword.success' | translate }}</div>
    <form *ngIf="!submitted" (ngSubmit)="onChangePassword()" #passwordForm="ngForm">
      <div class="form-group"><label>{{ 'changePassword.current' | translate }}</label><input name="currentPassword" [(ngModel)]="currentPassword" type="password" class="form-control" required /></div>
      <div class="form-group mt-3"><label>{{ 'changePassword.new' | translate }}</label><input name="newPassword" [(ngModel)]="newPassword" type="password" class="form-control" minlength="8" required /></div>
      <div class="form-group mt-3"><label>{{ 'changePassword.confirm' | translate }}</label><input name="confirmPassword" [(ngModel)]="confirmPassword" type="password" class="form-control" required /></div>
      <div class="text-danger mt-2">{{ error }}</div>
      <button type="submit" [disabled]="passwordForm.invalid" class="btn btn-primary w-100 mt-3">{{ 'changePassword.submit' | translate }}</button>
    </form>
    <button type="button" class="btn btn-link w-100 mt-2" (click)="returnToDashboard()">{{ 'changePassword.cancel' | translate }}</button>
  </div>
</div>
