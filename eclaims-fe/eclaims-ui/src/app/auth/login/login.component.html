<div class="container mt-5 col-md-4">
  <h3 class="page-title text-center">{{ 'login.title' | translate }}</h3>
  <div class="card p-4 shadow-sm">
    <div class="form-group">
      <label>{{ 'login.username' | translate }}</label>
      <input [(ngModel)]="username" class="form-control" [placeholder]="'login.usernamePlaceholder' | translate" />
    </div>
    <div class="form-group mt-3">
      <label>{{ 'login.password' | translate }}</label>
      <input [(ngModel)]="password" type="password" class="form-control" [placeholder]="'login.passwordPlaceholder' | translate" />
    </div>
    <div class="text-danger mt-2">{{ error }}</div>
    <button (click)="onLogin()" class="btn btn-primary w-100 mt-3">{{ 'nav.login' | translate }}</button>
    <div class="text-center mt-3">
      <a routerLink="/forgot-password">{{ 'login.forgotPassword' | translate }}</a>
      <span class="mx-2">|</span>
      <a routerLink="/register">{{ 'login.createAccount' | translate }}</a>
    </div>
  </div>
</div>
